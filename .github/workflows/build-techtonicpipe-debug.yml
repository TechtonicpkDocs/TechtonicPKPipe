name: Build TechTonicPipe debug APK

# TechTonicPipe: builds an installable debug APK on every dev push.
# Download it from the run's Artifacts section and install to test.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21
          cache: "gradle"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechTonicPipe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
